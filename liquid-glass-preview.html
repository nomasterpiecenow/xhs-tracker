const state={tab:'hot',filter:'all',sort:'score',query:'',page:1,pageSize:9};
document.querySelectorAll('.tab').forEach(btn=>{btn.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));document.getElementById('panel-'+btn.dataset.tab).classList.add('active');state.tab=btn.dataset.tab;});});
const themeBtn=document.getElementById('themeBtn');
themeBtn.addEventListener('click',()=>{const cur=document.body.getAttribute('data-theme');const next=cur==='light'?'dark':'light';document.body.setAttribute('data-theme',next);themeBtn.textContent=next==='light'?'🌙 深色':'☀️ 浅色';});
document.querySelectorAll('.pill[data-filter]').forEach(b=>{b.addEventListener('click',()=>{document.querySelectorAll('.pill[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.filter=b.dataset.filter;state.page=1;render();});});
document.querySelectorAll('.pill[data-sort]').forEach(b=>{b.addEventListener('click',()=>{document.querySelectorAll('.pill[data-sort]').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.sort=b.dataset.sort;state.page=1;render();});});
document.getElementById('searchInput').addEventListener('input',e=>{state.query=e.target.value.trim().toLowerCase();state.page=1;render();});
function sentimentLabel(s){return s==='pos'?'正向':s==='neg'?'负向':'中性';}
function avatarLetter(name){return(name||'?').trim().charAt(0).toUpperCase();}
function getFiltered(){let list=DATA.notes.slice();if(state.filter!=='all')list=list.filter(n=>n.platform===state.filter);if(state.query){const q=state.query;list=list.filter(n=>{return(n.title||'').toLowerCase().includes(q)||(n.author||'').toLowerCase().includes(q)||(n.dimensions||[]).join(',').toLowerCase().includes(q);});}if(state.sort==='score'){list.sort((a,b)=>parseFloat(b.totalScore)-parseFloat(a.totalScore));}else{list.sort((a,b)=>(b.createTime||'').localeCompare(a.createTime||''));}return list;}
function cardHTML(n){const plat=n.platform==='xhs'?'<span class="platform-badge xhs">小红书</span>':'<span class="platform-badge douyin">抖音</span>';const dims=(n.dimensions||[]).map(d=>'<span class="dim-tag">'+d+'</span>').join('');const sc=n._sentiment||'neu';return '<article class="card"><div class="card-head"><a class="title-link" href="'+n.noteLink+'" target="_blank" rel="noopener">'+n.title+'</a>'+plat+'</div><div class="metrics"><span class="m">🔥 互动 <b>'+n.interactiveCount+'</b></span><span class="m">📅 <b>'+n.createTime+'</b></span><span class="m">📊 总分 <b>'+n.totalScore+'</b></span></div><div class="dims">'+(dims||'<span class="dim-tag" style="opacity:.5">未分类</span>')+'</div><div class="scores"><span>相关度<b>'+n.relevanceScore+'</b></span><span>热度<b>'+n.popularityScore+'</b></span><span>总分<b>'+n.totalScore+'</b></span></div><div class="card-foot"><span class="author"><span class="avatar">'+avatarLetter(n.author)+'</span>'+(n.author||'佚名')+'</span><span class="sentiment '+sc+'"><span class="sdot"></span>'+sentimentLabel(sc)+'</span></div></article>';}
function renderPager(total){const pager=document.getElementById('pager');const pages=Math.max(1,Math.ceil(total/state.pageSize));if(state.page>pages)state.page=pages;let html='<button '+(state.page===1?'disabled':'')+' data-p="prev">‹ 上一页</button>';for(let i=1;i<=pages;i++){html+='<button class="'+(i===state.page?'active':'')+'" data-p="'+i+'">'+i+'</button>';}html+='<button '+(state.page===pages?'disabled':'')+' data-p="next">下一页 ›</button>';pager.innerHTML=html;pager.querySelectorAll('button').forEach(b=>{b.addEventListener('click',()=>{const p=b.dataset.p;if(p==='prev')state.page=Math.max(1,state.page-1);else if(p==='next')state.page=Math.min(pages,state.page+1);else state.page=parseInt(p,10);render();window.scrollTo({top:document.getElementById('panel-hot').offsetTop-80,behavior:'smooth'});});});}
function render(){const list=getFiltered();const grid=document.getElementById('grid');const start=(state.page-1)*state.pageSize;const pageList=list.slice(start,start+state.pageSize);if(pageList.length===0){grid.innerHTML='<div class="empty glass" style="grid-column: 1/-1;"><h3>没有匹配的笔记</h3><p>试试清空搜索或切换过滤条件</p></div>';}else{grid.innerHTML=pageList.map(cardHTML).join('');}renderPager(list.length);}
render();
